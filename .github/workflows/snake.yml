name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: haroonbuz
          outputs: |
            dist/github-snake.svg?color_snake=8B5CF6&color_dots=161B22,312E81,4338CA,6366F1,8B5CF6
            dist/github-snake-dark.svg?color_snake=8B5CF6&color_dots=161B22,312E81,4338CA,6366F1,8B5CF6

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
